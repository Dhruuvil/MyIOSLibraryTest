
name: Build MobyRewards XCFramework

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Package XCFramework
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Archive iOS Device
        run: |
          xcodebuild archive \
            -scheme MobyRewards \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/MobyRewards-iOS.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive iOS Simulator
        run: |
          xcodebuild archive \
            -scheme MobyRewards \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "$PWD/build/MobyRewards-Simulator.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Locate Framework Products
        id: locate
        run: |
          find build -name "MobyRewards.framework" -type d
          DEVICE="build/MobyRewards-iOS.xcarchive/Products/Library/Frameworks/MobyRewards.framework"
          SIMULATOR="build/MobyRewards-Simulator.xcarchive/Products/Library/Frameworks/MobyRewards.framework"

          test -d "$DEVICE" || {
            echo "Device framework not found at $DEVICE"
            exit 1
          }

          test -d "$SIMULATOR" || {
            echo "Simulator framework not found at $SIMULATOR"
            exit 1
          }

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -framework "build/MobyRewards-iOS.xcarchive/Products/Library/Frameworks/MobyRewards.framework" \
            -framework "build/MobyRewards-Simulator.xcarchive/Products/Library/Frameworks/MobyRewards.framework" \
            -output "$PWD/MobyRewards.xcframework"

      - name: Zip XCFramework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            MobyRewards.xcframework MobyRewards.xcframework.zip

          swift package compute-checksum MobyRewards.xcframework.zip

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobyRewards-XCFramework
          path: MobyRewards.xcframework.zip
          if-no-files-found: error
